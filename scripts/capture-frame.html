<!doctype html>
<html lang="en"><meta charset="utf-8"><title>SomnaShift · phone capture</title>
<style>
@font-face{font-family:Source;src:url('../dist/fonts/source-sans-3-latin.woff2') format('woff2');font-weight:200 900}
*{box-sizing:border-box}html,body{margin:0;width:848px;min-height:1776px;background:#f6f1eb;font-family:Source,sans-serif}.stage{width:424px;height:888px;transform:scale(2);transform-origin:top left;padding:2px 5px}.phone{position:relative;width:414px;height:884px;border:2px solid #91837a;background:#393431;border-radius:59px;box-shadow:inset 0 0 0 3px #211d1b;isolation:isolate}.phone:before{content:'';position:absolute;inset:5px;border:1px solid #74665f;border-radius:53px;z-index:3;pointer-events:none}.phone-screen{position:absolute;inset:10px;border-radius:47px;overflow:hidden;background:#f6f1eb;color:#342c29}.phone-screen iframe{position:absolute;left:0;top:28px;width:390px;height:832px;border:0;background:#f6f1eb}.phone-speaker{position:absolute;width:108px;height:28px;top:16px;left:50%;transform:translateX(-50%);border-radius:30px;background:#1b1716;z-index:5;pointer-events:none}.phone-status{height:28px;padding:4px 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;font-size:11px;font-weight:650;z-index:4}.phone-status>span:last-child{display:flex;align-items:center;gap:4px}.phone-status:after{content:'';position:absolute;inset:0;background:transparent;pointer-events:none}.phone[data-dialog=true] .phone-status:after{background:#17110d66}.phone-key{position:absolute;right:-5px;top:165px;width:3px;height:66px;border-radius:0 3px 3px 0;background:#8c7c71}.phone:after{content:'';position:absolute;left:-4px;top:135px;width:2px;height:46px;background:#8c7c71;border-radius:3px}
</style>
<div class="stage"><div class="phone"><div class="phone-screen"><div class="phone-status"><span id="capture-time">6:42</span><span>▮▮▮ <svg width="20" height="11" viewBox="0 0 18 10" aria-hidden="true"><rect x="1" y="1" width="14" height="8" rx="2" stroke="currentColor" fill="none"/><rect x="3" y="3" width="10" height="4" rx=".7" fill="currentColor"/><path d="M17 3v4" stroke="currentColor"/></svg></span></div><iframe title="SomnaShift phone capture"></iframe></div><div class="phone-speaker"></div><span class="phone-key"></span></div></div>
<script type="module">
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe');
const route=params.get('view')||'shift';params.delete('view');const workspace=params.has('workspace');params.delete('workspace');if(!workspace)params.set('embed','1');params.set('theme','daylight');
frame.src=new URL('../dist/'+route+'/?'+params,location.href);
frame.addEventListener('load',()=>{const doc=frame.contentDocument;const update=()=>{document.querySelector('.phone').dataset.dialog=String(Boolean(doc.querySelector('dialog[open]')));const time=doc.querySelector('.shift-clock strong,.now-time-value');if(time)document.querySelector('#capture-time').textContent=time.textContent.replace(/^0/,'');};new MutationObserver(update).observe(doc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['open']});update();});
</script></html>
